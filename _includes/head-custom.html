<!-- Loaded automatically by the minima theme into <head> on every page. -->
<!-- MathJax v3: render $...$ inline and $$...$$ block math.            -->
<!-- $ delimiters are used because Jekyll's kramdown strips the         -->
<!-- backslashes from \( \) and \[ \] before MathJax can see them.      -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
